[package]
name = "snipforge"
version = "0.1.0"
description = "SnipForge — 截图 / 录屏 / 剪贴板 / 图床 / 图片处理 一体化工具"
authors = ["SnipForge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "snipforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# tauri CLI 在 build 时会自动带上；直接 `cargo build --release` 时**必须**手动加
# `--features custom-protocol`，否则 release 二进制仍会去连 devUrl（127.0.0.1:5183），
# 窗口里全是"无法访问此页面"，看起来像前端坏了其实是构建姿势不对。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6"
log = "0.4"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
base64 = "0.22"
sha2 = "0.10"
urlencoding = "2"

xcap = "0.9"
arboard = "3.7"
windows-future = "0.3"

reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "blocking",
] }
hmac = "0.12"
sevenz-rust = { version = "0.6", features = ["compress"] }
gif = "0.13"
color_quant = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_MediaFoundation",
  "Win32_Media_KernelStreaming",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Foundation",
  "Foundation_Collections",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Globalization",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
