name: Release

# 打一个 v* tag 就出一条 release：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 为什么不用 tauri-action：它默认只把 bundle 目录里的安装包传上去，
# 绿色包（exe + plugins/）还得自己拼。这里手工走一遍，两个产物都明确可控，
# 也省掉一个需要长期跟随的上游 action。
#
# **版本号是 tag 和 Cargo.toml / tauri.conf.json 三方一致的**：
# 只改 tag 不改版本，装出来的程序会显示旧版本号，检查更新也会一直提示"有新版本"。
# 所以第一步就先校验，不一致直接失败。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write
  # 站点同步后要显式触发 pages.yml：GITHUB_TOKEN 推的 commit 不会触发其它
  # workflow（GitHub 的防递归限制），只能自己调度一次
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 与工程版本号一致
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  tauri=$CONF  package=$PKG"
          if [ "v$CONF" != "$TAG" ] || [ "$PKG" != "$CONF" ]; then
            echo "::error::版本号不一致：tag 应当是 v$CONF，package.json 应当是 $CONF"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 纯逻辑单测
        run: cargo test --manifest-path src-tauri/core/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # `--features custom-protocol` 不能省：Tauri CLI 只开 `tauri/custom-protocol`
      # （依赖的特性），不会开本 crate 的同名特性。漏了会让 `compile_error!` 直接拦下。
      - name: 构建 NSIS 安装包
        run: npx tauri build --features custom-protocol

      - name: 组装绿色包
        run: npm run portable

      - name: 生成发布说明
        run: node scripts/release-notes.mjs

      - name: 取版本号给后续步骤用
        id: meta
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: SnipForge ${{ steps.meta.outputs.version }}
          body_path: .release-notes.md
          # 0.x 全部当预览版：接口和配置项还会变，别让人以为这是稳定版
          prerelease: ${{ startsWith(steps.meta.outputs.version, '0.') }}
          draft: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-portable/*.zip
          fail_on_unmatched_files: true

      # 站点是纯静态页，版本号/包大小/日期都是写死的 —— 不同步的话，
      # 发布完产品页还挂着上一个版本，用户点下载以为没更新。
      - name: 同步站点版本号
        run: node scripts/sync-site-version.mjs

      # 更新日志区块同样由脚本从 CHANGELOG.md 生成，两个脚本改的是同一份
      # site/index.html，必须在同一个提交里带上去
      - name: 同步站点更新日志
        run: node scripts/sync-site-changelog.mjs

      - name: 提交站点更新
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --staged --quiet; then
            echo "站点已是最新，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(site): 同步版本号到 $(node -p "require('./package.json').version")"
          # tag 检出是 detached HEAD，要显式推到 main
          if git push origin HEAD:main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::站点改动推送失败（main 可能已有新提交），请手动跑 scripts/sync-site-version.mjs"
          fi
        id: site

      # 上面那步用的是 GITHUB_TOKEN 推送，GitHub 出于防递归不会让它触发
      # pages.yml —— 必须自己调度一次，否则站点改了但没重新部署。
      - name: 重新部署站点
        if: steps.site.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
        continue-on-error: true
